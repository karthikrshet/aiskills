[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiskills"
version = "0.1.0"
description = "Reusable AI Engineering Skills for Coding Agents"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Karthik Rajesh Shet" }]
keywords = ["ai", "agents", "skills", "rag", "llm", "engineering", "coding-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pip-audit>=2.9",
]

[project.scripts]
aiskills = "aiskills.main:cli"

[project.urls]
Homepage = "https://github.com/karthikrshet/aiskills"
Repository = "https://github.com/karthikrshet/aiskills"
Issues = "https://github.com/karthikrshet/aiskills/issues"
Changelog = "https://github.com/karthikrshet/aiskills/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["cli"]

[tool.setuptools.package-dir]
"" = "cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["cli/aiskills"]
omit = ["tests/*"]
